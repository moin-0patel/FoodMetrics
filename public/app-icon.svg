<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Food Metrics">
  <title>Food Metrics</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1b1f"/>
      <stop offset="1" stop-color="#04090b"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0fae7a"/>
      <stop offset="1" stop-color="#25e79f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.22" r="0.75">
      <stop offset="0" stop-color="#25e79f" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#25e79f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Rounded tile so the mark reads on both light and dark panels -->
  <rect width="512" height="512" rx="116" fill="url(#tile)"/>
  <rect width="512" height="512" rx="116" fill="url(#glow)"/>

  <!-- The plate: an open ring, suggesting a rim seen from above -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#25e79f" stroke-opacity="0.28" stroke-width="14"/>

  <!-- Ascending metric bars sitting on the plate's baseline. Rounded caps keep
       them legible when the whole mark is scaled down to a 16px favicon. -->
  <g fill="url(#mint)">
    <rect x="176" y="286" width="34" height="74"  rx="17"/>
    <rect x="228" y="242" width="34" height="118" rx="17"/>
    <rect x="280" y="196" width="34" height="164" rx="17"/>
  </g>

  <!-- Rising trend tick above the tallest bar -->
  <path d="M188 214 L245 172 L297 150" fill="none" stroke="#8affd2" stroke-opacity="0.85"
        stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="297" cy="150" r="15" fill="#8affd2"/>
</svg>
