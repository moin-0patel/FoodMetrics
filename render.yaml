# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploys the Vite + React SPA as a static site backed by Supabase.
#
# IMPORTANT: this file only takes effect for a service created FROM the blueprint
# (Render dashboard → New → Blueprint). A service created by hand ignores it, and
# Render then guesses the runtime — which is how a Vite app ends up being built
# with `go build`. If you see Go in the deploy log, the service was created
# manually: delete it and create it from this blueprint instead.
services:
  - type: web
    # Keep this name stable: it determines the <name>.onrender.com hostname, so
    # renaming it creates a NEW service on a new URL and orphans the old one.
    # If a service already holds this hostname, Render appends a suffix
    # (foodmetrics-5pon.onrender.com) — so delete the old service BEFORE applying
    # this blueprint if you want the clean name.
    name: foodmetrics
    runtime: static
    # --include=dev because `npm run build` runs tsc AND vite, both of which live
    # in devDependencies. If Render sets NODE_ENV=production, a plain `npm ci`
    # skips them and the build dies with "tsc: not found".
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: ./dist
    # Vite reads VITE_* at BUILD time — set these in the Render dashboard
    # (Environment) before the first deploy, or sync: false will prompt for them.
    envVars:
      # Supabase — authentication + data layer. Vite inlines them at BUILD time,
      # so set them before the first deploy. Without them the app runs on the
      # local mock layer.
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      # Data now follows auth (see src/lib/supabase/client.ts): when the two
      # VITE_SUPABASE_* vars are set, the app uses the shared Supabase data layer
      # and is multi-user. This var is optional — set it to "mock" only to force
      # the local/localStorage layer.
      - key: VITE_DATA_BACKEND
        value: supabase
    # SPA fallback so React Router deep links resolve to index.html.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
